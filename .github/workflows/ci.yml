name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Determine which paths changed ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
            frontend:
              - 'frontend/**'
              - 'shared/**'
            helm:
              - 'chart/**'

  # ── Backend ──
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: pip install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"
          cache-dependency-path: backend/poetry.lock

      - name: Install backend deps
        run: cd backend && poetry install

      - name: Lint
        run: cd backend && poetry run ruff check .

      - name: Format check
        run: cd backend && poetry run ruff format --check .

      - name: Type check
        run: cd backend && poetry run mypy app

      - name: Test with coverage
        run: cd backend && poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Check patch coverage
        run: cd backend && poetry run diff-cover coverage.xml --compare-branch=origin/main --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Frontend Lint + Build ──
  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: cd frontend && rm -f package-lock.json && npm install --legacy-peer-deps

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Build
        run: cd frontend && npm run build

  # ── Frontend Unit Tests ──
  frontend-unit-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: cd frontend && rm -f package-lock.json && npm install --legacy-peer-deps

      - name: Unit tests with coverage
        run: cd frontend && npx jest --coverage --coverageReporters=lcov --coverageReporters=text-summary

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check patch coverage
        run: diff-cover frontend/coverage/lcov.info --compare-branch=origin/main --fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  # ── Frontend E2E Tests ──
  frontend-e2e-tests:
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: cd frontend && rm -f package-lock.json && npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Run E2E tests
        run: cd frontend && npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Helm Chart Lint ──
  helm-lint:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint with defaults
        run: helm lint chart/the-experiment/

      - name: Lint with production values
        run: helm lint chart/the-experiment/ -f chart/the-experiment/values-production.yaml
