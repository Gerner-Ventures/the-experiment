[tool.poetry]
name = "the-experiment"
version = "0.1.0"
description = "AI agent simulation engine — Lord of the Flies meets The Truman Show"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = "^2.0"
alembic = "^1.14"
asyncpg = "^0.30.0"
psycopg = {extras = ["binary"], version = "^3.2"}
redis = "^5.0"
litellm = "^1.55"
pydantic = "^2.10"
pydantic-settings = "^2.7"
websockets = "^14.0"
structlog = "^25.1"
greenlet = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.8"
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "structlog"
ignore_missing_imports = true
